<body>
<title>선 긋기 축구</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: 전술판 상단 정보 + 세로 경기장 + 하단 실행 버튼. 잔디 위 한 가지 룩으로 고정 */
:root{
  --bg:#0f2a1c; --panel:#173a27; --line:#2c5a3f;
  --ink:#f3f7ef; --muted:#a9c3b0;
  --mate:#ffd23f; --foe:#ff6b5e;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%; background:var(--bg); color:var(--ink); font-family:var(--body);
  display:flex; flex-direction:column; gap:6px; overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;
  -webkit-user-select:none; user-select:none;
}
.top,.bottom,.hint{max-width:420px; width:100%; margin-inline:auto}
.top{display:flex; align-items:center; gap:8px}
.top .title{flex:1; min-width:0}
.top .title b{display:block; font-family:var(--display); font-weight:400; font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.top .title small{color:var(--muted); font-size:12px}
.pill{background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-family:var(--display); font-size:17px; font-variant-numeric:tabular-nums; white-space:nowrap}
.pill.last{color:var(--foe); border-color:var(--foe)}
.icon-btn{background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-family:var(--body); font-size:13px; font-weight:700; cursor:pointer}
.hint{min-height:18px; font-size:12.5px; color:var(--muted); text-align:center; line-height:1.4}
.stage{flex:1; min-height:0; position:relative; display:grid; place-items:center}
canvas{display:block; border-radius:12px; touch-action:none; box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bottom{display:grid; grid-template-columns:1fr 2fr; gap:8px}
button{font-family:var(--display); font-size:20px; border:0; border-radius:12px; padding:11px; cursor:pointer}
button:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45; cursor:default; transform:none}
.primary{background:var(--mate); color:#1d1a05}
.ghost{background:var(--panel); color:var(--ink); border:1px solid var(--line)}
.overlay{position:absolute; inset:0; display:grid; place-items:center; padding:12px; overflow-y:auto}
.card{background:rgba(15,42,28,.96); border:1px solid var(--line); border-radius:16px; padding:20px 18px; max-width:340px; width:100%; display:flex; flex-direction:column; gap:12px}
.card h1{font-family:var(--display); font-weight:400; font-size:34px; margin:0; text-align:center; text-wrap:balance}
.card h1 span{color:var(--mate)}
.card h2{font-family:var(--display); font-weight:400; font-size:22px; margin:0; text-wrap:balance}
.card p{margin:0; font-size:14px; line-height:1.55}
.card .goal{color:var(--mate); font-weight:700}
.rules{margin:0; padding-left:18px; font-size:13px; line-height:1.55; display:flex; flex-direction:column; gap:3px}
.legend{display:grid; grid-template-columns:auto 1fr; gap:6px 8px; font-size:13px; line-height:1.4; align-items:center}
.badge{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--foe); color:#3a0b07; font-weight:700; font-size:12px}
.list{display:flex; flex-direction:column; gap:12px}
.total{display:flex; justify-content:space-between; align-items:center; background:var(--panel); border-radius:10px; padding:8px 12px; font-size:13px; color:var(--muted)}
.total b{font-family:var(--display); font-weight:400; font-size:18px; color:var(--mate)}
.chap{display:flex; flex-direction:column; gap:6px}
.chap h3{margin:0; display:flex; justify-content:space-between; align-items:center; font-family:var(--display); font-weight:400; font-size:16px}
.tiles{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.tile{aspect-ratio:1; max-width:100%; padding:2px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--ink); font-size:18px}
.tile small{font-family:var(--body); font-size:8.5px; color:var(--mate); letter-spacing:0}
.tile small i{font-style:normal; color:#3d6a50}
.tile.now{border:2px solid var(--mate)}
.vsbtn{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; background:linear-gradient(90deg,#ffd23f22,#ff6b5e22); border:1.5px solid var(--mate); color:var(--ink); padding:10px 14px}
.vsbtn b{font-family:var(--display); font-weight:400; font-size:20px; color:var(--mate)}
.vsbtn small{font-family:var(--body); font-size:12px; color:var(--muted)}
.vsbox{display:flex; flex-direction:column; gap:8px}
.vsbox h3{margin:6px 0 0; font-family:var(--display); font-weight:400; font-size:16px}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg button{flex:1; min-width:0; font-family:var(--body); font-size:13px; font-weight:700; padding:9px 6px; background:var(--panel); color:var(--ink); border:1px solid var(--line)}
.seg button.on{background:var(--mate); color:#1d1a05; border-color:var(--mate)}
.joinrow{display:grid; grid-template-columns:1fr auto; gap:8px}
.joinrow input{font-family:var(--display); font-size:22px; letter-spacing:.3em; text-align:center; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:8px; min-width:0}
.joinrow input:focus-visible{outline:2px solid var(--mate)}
.code{font-family:var(--display); font-size:54px; letter-spacing:.2em; color:var(--mate); text-align:center}
.err{margin:0; min-height:1em; color:#ffb0a8; font-size:13px; text-align:center}
.sub{color:var(--muted); font-size:13px}
.chap h3 .tag{font-family:var(--body); font-size:11px}
.tile:disabled small{color:var(--muted)}
.pz{display:flex; align-items:center; gap:10px; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; color:var(--ink); font-family:var(--body); font-size:14px}
.pz .no{font-family:var(--display); font-size:20px; width:26px; color:var(--muted)}
.pz .txt{flex:1; min-width:0}
.pz .txt b{display:block; font-size:15px}
.pz .txt small{color:var(--muted)}
.pz .tag{font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px}
.tag.atk{background:#ffd23f33; color:var(--mate)} .tag.def{background:#ff6b5e33; color:#ffb0a8}
.stars{font-size:15px; color:var(--mate); letter-spacing:1px; white-space:nowrap}
.stars .off{color:#3d6a50}
.bigstars{text-align:center; font-size:34px}
.coach{position:absolute; top:8px; left:50%; transform:translateX(-50%); width:min(330px, calc(100% - 16px)); background:rgba(12,32,22,.95); border:1.5px solid var(--mate); border-radius:12px; padding:10px 12px; font-size:13.5px; line-height:1.5; display:flex; flex-direction:column; gap:4px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:2; animation:pop .25s ease-out}
.coach b{color:var(--mate)}
.coach small{color:var(--muted); font-size:11px; text-align:right}
@keyframes pop{from{opacity:0; transform:translate(-50%,-6px)}}
@media (prefers-reduced-motion:reduce){.coach{animation:none}}
.checks{list-style:none; margin:0; padding:10px 12px; background:var(--panel); border-radius:10px; display:flex; flex-direction:column; gap:5px; text-align:left; font-size:13px; color:var(--muted)}
.checks li{display:flex; gap:8px; align-items:baseline}
.checks li span{color:#3d6a50; font-size:14px}
.checks li.ok{color:var(--ink)}
.checks li.ok span{color:var(--mate)}
.row{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.center{text-align:center}
</style>

<div class="top">
  <button class="icon-btn" id="menuBtn" type="button">목록</button>
  <div class="title"><b id="pTitle">선 긋기 축구</b><small id="pGoal">퍼즐을 골라 주세요</small></div>
  <div class="pill" id="turnPill">턴 -</div>
</div>
<div class="hint" id="hint"></div>

<div class="stage" id="stage">
  <canvas id="field" aria-label="전술 축구 경기장. 선수를 끌어 이동 길과 패스를 그린 뒤 실행합니다."></canvas>

  <div class="overlay" id="listView">
    <div class="card">
      <h1>선 긋기 <span>축구</span></h1>
      <p class="center" style="color:var(--muted)">선으로 지시하면, 양 팀이 동시에 움직여요.</p>
      <button class="vsbtn" id="vsOpen" type="button"><b>2인 대전</b><small>기기 두 대 · 한 명은 공격, 한 명은 수비</small></button>
      <div class="list" id="puzzleList"></div>
    </div>
  </div>

  <div class="overlay" id="vsView" hidden>
    <div class="card">
      <h2>2인 대전</h2>
      <p class="sub">양쪽이 각자 기기에서 수를 정하면, 동시에 1.5초씩 움직여요.</p>
      <div id="vsStart" class="vsbox">
        <h3>방 만들기</h3>
        <div class="seg" id="vsRole"><button type="button" data-v="atk" class="on">내가 공격</button><button type="button" data-v="def">내가 수비</button></div>
        <div class="seg" id="vsMap"></div>
        <button class="primary" id="vsCreate" type="button">방 만들기</button>
        <h3>참가하기</h3>
        <div class="joinrow"><input id="vsCode" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="코드 4자리" aria-label="방 코드"><button class="ghost" id="vsJoin" type="button">참가</button></div>
      </div>
      <div id="vsWait" class="vsbox center" hidden>
        <p class="sub">방 코드</p>
        <div class="code" id="vsCodeShow"></div>
        <p class="sub">상대 기기에서 이 코드를 넣으면 바로 시작해요.</p>
      </div>
      <p class="err" id="vsErr" role="alert"></p>
      <button class="ghost" id="vsBack" type="button">뒤로</button>
    </div>
  </div>

  <div class="coach" id="coach" role="status" hidden><span id="coachText"></span><small>탭해서 닫기</small></div>

  <div class="overlay" id="resultView" hidden>
    <div class="card center">
      <h2 id="rTitle"></h2>
      <div class="bigstars" id="rStars"></div>
      <ul class="checks" id="rChecks"></ul>
      <p id="rMsg"></p>
      <div class="row">
        <button class="ghost" id="rRetry" type="button">다시</button>
        <button class="primary" id="rNext" type="button">다음 퍼즐</button>
      </div>
    </div>
  </div>
</div>

<div class="bottom">
  <button class="ghost" id="clearBtn" type="button">지우기</button>
  <button class="primary" id="runBtn" type="button">실행 ▶</button>
</div>

  // ================= 실행(동시 1.5초) =================
  function kick(o, t, shot) {
    ball.fly = { tx: t.x, ty: t.y, shot };
    ball.kicker = o; ball.kickT = 0; ball.owner = null;
  }

  function startExec() {
    if (phase !== 'plan' && phase !== 'wait') return;
    if (VS) players.forEach(p => { if (!p.keeper) p.route = p.plan.run ? p.plan.run.slice() : []; });
    else {
      if (P.mode === 'atk') aiDefend(); else aiAttack();
      us().forEach(p => { p.route = p.plan.run ? p.plan.run.slice() : []; });
    }
    players.forEach(p => { p.sx = p.x; p.sy = p.y; p.trail = [{ x: p.x, y: p.y }]; });
    const o = ball.owner;
    if (o) {
      const act = o.team === 'us' ? o.plan.ball : o.aiBall;
      if (act && act.type === 'pass') kick(o, o.team === 'us' ? passTarget(act.to, act.mode) : act, false);
      if (act && act.type === 'shot') kick(o, { x: act.x, y: GOAL.y - 6 }, true);
    }
    simT = 0; phase = 'exec';
    refreshUI();
  }

  function finish(result, title, msg) {
    if (phase === 'done') return;
    phase = 'done';
    let s = 0; const raw = { title, msg };
    if (VS) {
      const atkWon = result === 'clear', iWon = (VS.role === 'atk') === atkWon;
      msg = title + ' · ' + (atkWon ? '공격 팀 승리' : '수비 팀 승리');
      title = iWon ? '승리!' : '패배';
    }
    // 별 기준: 3자 침투로 넣은 골은 침투에 쓴 한 턴을 보상해 기준 턴 +1까지 인정
    let checks = null;
    if (!VS) {
      const ok = result === 'clear';
      if (P.mode === 'atk') {
        const parT = P.par + (thirdMan ? 1 : 0);
        checks = [
          { ok, label: '골 넣기' },
          { ok: ok && turn <= parT, label: `${P.par}턴 이내 골` + (thirdMan ? ' (3자 침투 보너스로 ' + parT + '턴까지 인정)' : '') },
          { ok: ok && thirdMan, label: '3자 침투 (A→B 다음 B→C 패스)' },
        ];
      } else {
        checks = [
          { ok, label: '공 뺏기' },
          { ok: ok && turn <= P.par, label: `${P.par}턴 이내에 뺏기` },
          { ok: ok && turn === 1, label: '1턴 만에 뺏기' },
        ];
      }
      if (ok) { s = checks.filter(c => c.ok).length; stars[P.id] = Math.max(stars[P.id] || 0, s); saveStars(stars); }
    }
    outcome = { result, title, msg, s, raw, checks };
    if (VS && VS.host) vsWriteState();
    setTimeout(showResult, 900);
    refreshUI();
  }

  function gain(p, how) {
    const kicker = ball.kicker;
    ball.owner = p; ball.fly = null; ball.kicker = null;
    if (p.team !== atkTeam()) {
      const what = p.keeper ? '선방' : how === 'tackle' ? '태클' : '가로채기';
      popup(what + '!', p.x, p.y - 26, p.team === 'us' ? '#9ff0b8' : '#ff8a80', true);
      if (P.mode === 'atk') finish('fail', what + ' 당했어요', '상대가 어디로 움직일지 다시 읽어 보세요. 화살표와 배지가 힌트예요.');
      else finish('clear', '공 뺏기 성공!', `${turn}턴째에 ${what}로 공을 뺏었어요.`);
      return;
    }
    if (kicker && kicker !== p && P.mode === 'atk') {
      if (lastPass && lastPass.to === kicker && lastPass.from !== p) { thirdMan = true; popup('3자 침투!', p.x, p.y - 44, '#9ff0b8', true); coach('third', '주고받는 사이 <b>세 번째 선수</b>가 받으면 3자 침투! 별 하나 더, 기준 턴도 <b>+1턴</b> 인정돼요.'); }
      else popup('패스 성공', p.x, p.y - 26, '#ffe066');
      lastPass = { from: kicker, to: p };
    }
  }

  function simStep(dt) {
    simT += dt;
    const o = ball.owner;
    // 1) 태클 판정: 2명이 붙거나, 압박 트리거 상태에서 1명이 붙으면 성공. 1명만 붙으면 몸으로 막힘
    players.forEach(p => { p.blocked = false; });
    if (o && !ball.fly && !o.keeper) {
      const opp = players.filter(q => q.team !== o.team && !q.keeper);
      const n2 = opp.filter(q => dist(q, o) < PRESS_R);
      const n1 = opp.filter(q => dist(q, o) < BLOCK_R).sort((a, b) => dist(a, o) - dist(b, o));
      if (n2.length >= 2 || (n1.length && isTrigger(o))) { gain((n1[0] || n2[0]), 'tackle'); if (phase === 'done') return; }
      else if (n1.length) o.blocked = true;
    }
    // 2) 이동
    players.forEach(p => {
      if (p.keeper || p.blocked || !p.route.length) return;
      let step = (ball.owner === p && !ball.fly ? DRIB : RUN) * dt;
      while (step > 0 && p.route.length) {
        const t = p.route[0], d = dist(p, t);
        if (d <= step) { p.x = t.x; p.y = t.y; p.route.shift(); step -= d; }
        else { p.x += (t.x - p.x) / d * step; p.y += (t.y - p.y) / d * step; step = 0; }
      }
      if (dist(p, lastOf(p.trail)) > 6) p.trail.push({ x: p.x, y: p.y });
    });
    // 3) 골키퍼: 공과 골대 중앙 사이에 서고, 슛이면 조금 늦게 반응
    let kx = 180 + (ball.x - 180) * 0.3, ks = 50;
    if (ball.fly && ball.fly.shot) {
      ks = ball.kickT > 0.15 ? 70 : 0;
      const dy = ball.fly.ty - ball.y;
      kx = Math.abs(dy) > 1 ? ball.x + (ball.fly.tx - ball.x) * (keeper.y - ball.y) / dy : ball.fly.tx;
    }
    kx = clamp(kx, GOAL.x1 + 8, GOAL.x2 - 8);
    keeper.x += clamp(kx - keeper.x, -ks * dt, ks * dt);
    // 4) 공
    ball.kickT += dt;
    const canTouch = q => !(q === ball.kicker && ball.kickT < 0.25);
    if (ball.fly) {
      const f = ball.fly, v = (f.shot ? SHOT_V : PASS_V) * dt, d = dist(ball, { x: f.tx, y: f.ty });
      if (d <= v) { ball.x = f.tx; ball.y = f.ty; }
      else { ball.x += (f.tx - ball.x) / d * v; ball.y += (f.ty - ball.y) / d * v; }
      let best = null, bd = 1e9;
      players.forEach(q => { if (!canTouch(q)) return; const r = q.keeper ? KEEP_R : INTER_R, dd = dist(q, ball); if (dd < r && dd < bd) { bd = dd; best = q; } });
      if (best) { gain(best, 'intercept'); return; }
      if (d <= v) {
        if (f.shot) {
          ball.fly = null;
          popup('골!!', 180, 140, '#ffe066', true);
          if (P.mode === 'atk') finish('clear', '골!', `${turn}턴 만에 골을 넣었어요.` + (thirdMan ? ' 3자 침투까지 성공!' : ''));
          else finish('fail', '실점했어요', '상대 성향대로 움직였어요. 배지와 화살표를 다시 읽어 보세요.');
          return;
        }
        ball.fly = null;   // 공간에 떨어진 공: 먼저 닿는 사람이 가짐
      }
    } else if (ball.owner) {
      ball.x = ball.owner.x; ball.y = ball.owner.y;
    } else {
      let best = null, bd = 1e9;
      players.forEach(q => { if (!canTouch(q)) return; const dd = dist(q, ball); if (dd < CTRL_R && dd < bd) { bd = dd; best = q; } });
      if (best) { gain(best, 'loose'); return; }
    }
    // 5) 턴 종료
    if (simT >= TURN - 1e-6) endTurn();
  }

  function endTurn() {
    players.forEach(p => {
      if (p.keeper) return;
      p.vx = (p.x - p.sx) / TURN; p.vy = (p.y - p.sy) / TURN;
      p.plan = { run: null, ball: null }; p.route = []; p.aiBall = null;
    });
    if (turn >= P.turns) {
      if (P.mode === 'atk') finish('fail', '턴을 다 썼어요', `${P.turns}턴 안에 골을 넣지 못했어요.`);
      else finish('fail', '공을 못 뺏었어요', `${P.turns}턴 동안 상대가 공을 지켰어요. 상대가 다음에 뛸 곳을 먼저 막아 보세요.`);
      return;
    }
    turn++; phase = 'plan';
    if (VS && VS.host) vsWriteState();
    if (VS && VS.pending) { const st = VS.pending; VS.pending = null; vsApplyState(st); }
    refreshUI();
    if (VS) vsCheck();
  }

  // ================= 그리기 =================
  function drawPitch() {
    for (let i = 0; i * 40 < H; i++) { ctx.fillStyle = i % 2 ? '#2b8048' : '#30894f'; ctx.fillRect(0, i * 40, W, 40); }
    // 5레인(측면/하프스페이스/중앙)
    ctx.fillStyle = 'rgba(255,255,255,.035)';
    ctx.fillRect(LANES[1], GOAL.y, LANES[2] - LANES[1], H); ctx.fillRect(LANES[3], GOAL.y, LANES[4] - LANES[3], H);
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1; ctx.setLineDash([3, 7]);
    [1, 2, 3, 4].forEach(i => { ctx.beginPath(); ctx.moveTo(LANES[i], GOAL.y); ctx.lineTo(LANES[i], H); ctx.stroke(); });
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.font = '9px "Noto Sans KR", sans-serif'; ctx.textAlign = 'center';
    ['측면', '하프', '중앙', '하프', '측면'].forEach((t, i) => ctx.fillText(t, (LANES[i] + LANES[i + 1]) / 2, H - 6));
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
    ctx.strokeRect(12, GOAL.y, W - 24, H + 20);
    ctx.beginPath(); ctx.moveTo(12, 620); ctx.lineTo(W - 12, 620); ctx.stroke();
    ctx.beginPath(); ctx.arc(180, 620, 50, Math.PI, 2 * Math.PI); ctx.stroke();
    ctx.strokeRect(64, GOAL.y, 232, 110); ctx.strokeRect(122, GOAL.y, 116, 36);
    ctx.beginPath(); ctx.arc(180, 124, 46, 0.71, Math.PI - 0.71); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(GOAL.x1, 22, GOAL.x2 - GOAL.x1, GOAL.y - 22);
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
    for (let x = GOAL.x1; x <= GOAL.x2; x += 10) { ctx.beginPath(); ctx.moveTo(x, 22); ctx.lineTo(x, GOAL.y); ctx.stroke(); }
    for (let y = 22; y <= GOAL.y; y += 7) { ctx.beginPath(); ctx.moveTo(GOAL.x1, y); ctx.lineTo(GOAL.x2, y); ctx.stroke(); }
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(GOAL.x1, GOAL.y); ctx.lineTo(GOAL.x1, 22); ctx.lineTo(GOAL.x2, 22); ctx.lineTo(GOAL.x2, GOAL.y); ctx.stroke();
  }

  function drawShadows() {   // 커버 섀도우: 공 기준으로 수비수 뒤쪽 그림자
    if (P.mode !== 'atk' || phase !== 'plan' || !ball.owner || ctrlTeam() !== 'us') return;
    them().forEach(d => {
      const a = Math.atan2(d.y - ball.y, d.x - ball.x), L = dist(d, ball);
      if (L < 20) return;
      const half = Math.atan2(SHADOW_R, L), len = 110;
      const g = ctx.createLinearGradient(d.x, d.y, d.x + Math.cos(a) * len, d.y + Math.sin(a) * len);
      g.addColorStop(0, 'rgba(10,30,20,.38)'); g.addColorStop(1, 'rgba(10,30,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(d.x + Math.cos(a + Math.PI / 2) * SHADOW_R, d.y + Math.sin(a + Math.PI / 2) * SHADOW_R);
      ctx.lineTo(d.x + Math.cos(a + half * 2.2) * (L + len) - Math.cos(a) * L, d.y + Math.sin(a + half * 2.2) * (L + len) - Math.sin(a) * L);
      ctx.lineTo(d.x + Math.cos(a - half * 2.2) * (L + len) - Math.cos(a) * L, d.y + Math.sin(a - half * 2.2) * (L + len) - Math.sin(a) * L);
      ctx.lineTo(d.x + Math.cos(a - Math.PI / 2) * SHADOW_R, d.y + Math.sin(a - Math.PI / 2) * SHADOW_R);
      ctx.closePath(); ctx.fill();
    });
  }

  function arrow(x1, y1, x2, y2, color, w) {
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - Math.cos(a - 0.45) * 8, y2 - Math.sin(a - 0.45) * 8);
    ctx.lineTo(x2 - Math.cos(a + 0.45) * 8, y2 - Math.sin(a + 0.45) * 8);
    ctx.closePath(); ctx.fill();
  }

  function drawInertia() {   // 관성 화살표 = 지난 턴 움직임을 다음 턴으로 이은 예상
    if (phase !== 'plan' && phase !== 'wait') return;
    players.forEach(p => {
      if (p.keeper || Math.hypot(p.vx, p.vy) < 5) return;
      const t = pred(p);
      ctx.setLineDash([4, 4]);
      arrow(p.x, p.y, t.x, t.y, p.team === 'them' ? 'rgba(255,190,180,.85)' : 'rgba(255,240,170,.35)', 2);
      ctx.setLineDash([]);
    });
  }

  function lineStyleFor(o, tg) {
    const blocked = them().some(d => segDist(d, o, tg) < SHADOW_R);
    return blocked ? '#ff4d4d' : '#ffffff';
  }

  function drawPlans() {
    if (phase !== 'plan' && phase !== 'wait') return;
    ctrlPlayers().forEach(p => {
      if (p.plan.run && p.plan.run.length) {
        const dribble = p.plan.ball && p.plan.ball.type === 'dribble';
        ctx.strokeStyle = dribble ? '#ffe066' : 'rgba(255,224,102,.85)';
        ctx.lineWidth = dribble ? 4 : 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.setLineDash(dribble ? [] : [7, 5]);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); p.plan.run.forEach(q => ctx.lineTo(q.x, q.y)); ctx.stroke(); ctx.setLineDash([]);
        const e = lastOf(p.plan.run);
        ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(e.x, e.y, 4.5, 0, 7); ctx.fill();
      }
      const b = p.plan.ball;
      if (b && b.type === 'pass') {
        const tg = passTarget(b.to, b.mode);
        ctx.setLineDash([10, 6]); arrow(p.x, p.y, tg.x, tg.y, lineStyleFor(p, tg), 3); ctx.setLineDash([]);
      }
      if (b && b.type === 'shot') arrow(p.x, p.y, b.x, GOAL.y - 4, '#ffe066', 3.5);
    });
    // 지금 그리는 중인 선
    if (gesture && gesture.pts.length) {
      const g = gesture, o = g.p;
      const cap = g.kind === 'run' ? RUN_LEN : DRIB_LEN;
      ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(o.x, o.y); g.pts.forEach(q => ctx.lineTo(q.x, q.y)); ctx.stroke();
      const end = lastOf(g.pts);
      let label = null, color = '#fff';
      if (g.kind === 'ball') {
        if (inGoalMouth(end)) { label = dist(o, GC) > SHOT_RANGE ? '너무 멀어요' : '슛'; color = '#ffe066'; }
        else {
          const r = receiverAt(o, end);
          if (r) {
            const tg = passTarget(r.q, r.mode), far = dist(o, tg) > passCap(o);
            label = far ? '너무 멀어요' : (r.mode === 'end' ? '공간 패스' : '발밑 패스');
            color = far ? '#bbb' : lineStyleFor(o, tg);
            ctx.setLineDash([10, 6]); arrow(o.x, o.y, tg.x, tg.y, color, 3); ctx.setLineDash([]);
          } else label = '드리블';
        }
      }
      const cut = truncate(g.pts, cap, o);
      if (!(label && label !== '드리블')) {
        ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(o.x, o.y); cut.forEach(q => ctx.lineTo(q.x, q.y)); ctx.stroke();
        if (cut.length) { const e = lastOf(cut); ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(e.x, e.y, 5, 0, 7); ctx.fill(); }
      }
      if (label) {
        ctx.font = '14px "Black Han Sans", sans-serif'; ctx.textAlign = 'center';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(label, end.x, end.y - 16);
        ctx.fillStyle = color === '#ff4d4d' ? '#ff8a80' : '#fff'; ctx.fillText(label, end.x, end.y - 16);
      }
    }
  }

  function drawPlayer(p) {
    const x = p.x, y = p.y;
    let fill, stroke, label = null, lc = '#2a2000';
    if (p.keeper) { fill = p.team === 'us' ? '#5fe0c8' : '#b18cff'; stroke = p.team === 'us' ? '#145a4d' : '#3d2a73'; label = 'GK'; lc = p.team === 'us' ? '#0b302a' : '#1c1238'; }
    else if (p.team === 'us') { fill = '#ffd23f'; stroke = '#5a4500'; label = p.num; }
    else { fill = '#ff6b5e'; stroke = '#7a1d16'; label = P.versus ? p.idx + 1 : TRAIT[p.trait].ch; lc = '#3a0b07'; }
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x + 2, y + 4, 11, 7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = lc; ctx.font = `bold ${p.keeper ? 9 : 11}px "Noto Sans KR", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x, y + 0.5); ctx.textBaseline = 'alphabetic';
    // 대인형이 맡은 선수 표시
    if (phase === 'plan' && p.trait === 'man' && P.mode === 'atk' && !P.versus) {
      const m = us()[p.mark];
      ctx.strokeStyle = 'rgba(255,140,130,.35)'; ctx.lineWidth = 1; ctx.setLineDash([2, 4]);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(m.x, m.y); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  function render() {
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    drawPitch();
    if (!P) return;
    drawShadows();
    if (phase === 'exec' || phase === 'done') {
      players.forEach(p => {
        if (!p.trail || p.trail.length < 2) return;
        ctx.strokeStyle = p.team === 'us' ? 'rgba(255,224,102,.35)' : 'rgba(255,120,110,.35)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.trail[0].x, p.trail[0].y); p.trail.forEach(q => ctx.lineTo(q.x, q.y)); ctx.stroke();
      });
    }
    drawInertia();
    drawPlans();
    // 공 가진 선수 표시 + 압박 트리거
    const o = ball.owner;
    if (o && !ball.fly && phase !== 'done') {
      ctx.strokeStyle = o.team === 'us' ? '#fff5c2' : '#ffd0ca'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(o.x, o.y, 17 + Math.sin(tPulse * 5) * 2, 0, 7); ctx.stroke();
      if (phase === 'plan' && isTrigger(o)) {
        const txt = o.team === atkTeam() && P.mode === 'def' ? '압박 찬스!' : '압박 위험!';
        ctx.font = '13px "Black Han Sans", sans-serif'; ctx.textAlign = 'center';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(txt, o.x, o.y + 32);
        ctx.fillStyle = P.mode === 'def' ? '#9ff0b8' : '#ff8a80'; ctx.fillText(txt, o.x, o.y + 32);
      }
    }
    players.forEach(drawPlayer);
    // 공
    const bx = ball.owner && !ball.fly ? ball.owner.x + 9 : ball.x;
    const by = ball.owner && !ball.fly ? ball.owner.y - 9 : ball.y;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx, by, 5, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(bx, by, 1.8, 0, 7); ctx.fill();
    popups.forEach(p => {
      ctx.globalAlpha = clamp(p.life / p.max * 1.6, 0, 1);
      ctx.font = (p.big ? '26px' : '14px') + ' "Black Han Sans", sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    });
  }

  // ================= 화면 / UI =================
  function refreshUI() {
    if (!P) { ui.turn.textContent = '턴 -'; ui.run.disabled = true; ui.clear.disabled = true; ui.hint.textContent = ''; return; }
    ui.turn.textContent = `턴 ${turn}/${P.turns}`;

  // ================= 2인 대전 (db로 두 기기 동기화) =================
  // matches/m<코드>                 방 정보 {map, hostRole, round, status, host, guest}
  // matches/m<코드>/turns/r<R>t<T>-atk|def   각자 낸 수
  // matches/m<코드>/sync/r<R>          방장 기기가 쓰는 턴 종료 상태(두 기기 위치 맞춤)
  // claude.ai 안에서는 db 기능, 일반 웹사이트에서는 PeerJS로 두 기기를 직접 연결(같은 모양의 저장소로 감쌈)
  function peerStore() {
    const store = new Map(), subs = [];
    let peer = null, conn = null;
    const notify = () => setTimeout(() => subs.slice().forEach(f => f()), 0);
    const clone = d => d == null ? d : JSON.parse(JSON.stringify(d));
    const write = (path, data) => {
      store.set(path, clone(data)); notify();
      if (conn && conn.open) conn.send({ t: 'w', path, data: clone(data) });
    };
    const onData = m => {
      if (!m) return;
      if (m.t === 'sync') { m.all.forEach(([k, v]) => store.set(k, v)); notify(); if (api._synced) api._synced(); }
      if (m.t === 'w') { store.set(m.path, m.data); notify(); }
    };
    const watchClose = c => c.on('close', () => { if (VS) popup('상대와 연결이 끊겼어요', 180, 320, '#ff8a80', true); });
    const snapOf = p => { const d = store.get(p); return { id: p.split('/').pop(), exists: d != null, data: () => clone(d), metadata: {} }; };
    const docRef = path => ({
      path, id: path.split('/').pop(),
      get: async () => snapOf(path),
      set: async d => write(path, d),
      update: async d => { if (!store.has(path)) throw { code: 'invalid_argument' }; write(path, Object.assign({}, store.get(path), clone(d))); },
      onSnapshot: next => { const f = () => next(snapOf(path)); subs.push(f); setTimeout(f, 0); return () => { const i = subs.indexOf(f); if (i >= 0) subs.splice(i, 1); }; },
      collection: c => colRef(path + '/' + c),
    });
    const colRef = path => ({
      path, doc: id => docRef(path + '/' + id),
      onSnapshot: next => {
        const depth = path.split('/').length + 1;
        const f = () => { const docs = [...store.keys()].filter(k => k.startsWith(path + '/') && k.split('/').length === depth).map(snapOf); next({ docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: {} }); };
        subs.push(f); setTimeout(f, 0); return () => { const i = subs.indexOf(f); if (i >= 0) subs.splice(i, 1); };
      },
    });
    const reset = () => { try { if (peer) peer.destroy(); } catch {} peer = null; conn = null; store.clear(); };
    const api = {
      doc: docRef, collection: colRef, reset,
      host: code => new Promise((res, rej) => {
        reset();
        peer = new window.Peer('linesoccer-' + code);
        peer.on('open', () => res());
        peer.on('error', e => rej({ code: e.type === 'unavailable-id' ? 'taken' : 'unavailable' }));
        peer.on('connection', c => {
          conn = c; watchClose(c);
          c.on('open', () => c.send({ t: 'sync', all: [...store.entries()] }));
          c.on('data', onData);
        });
      }),
      join: code => new Promise((res, rej) => {
        reset();
        const timer = setTimeout(() => rej({ code: 'not_found' }), 9000);
        peer = new window.Peer();
        peer.on('error', e => { clearTimeout(timer); rej({ code: e.type === 'peer-unavailable' ? 'not_found' : 'unavailable' }); });
        peer.on('open', () => {
          conn = peer.connect('linesoccer-' + code, { reliable: true });
          watchClose(conn);
          conn.on('data', onData);
          api._synced = () => { api._synced = null; clearTimeout(timer); res(); };
        });
      }),
    };
    return api;
  }

    vsUnsub.forEach(u => u()); vsUnsub = []; if (syncUnsub) { syncUnsub(); syncUnsub = null; }
    VS = null; P = null; phase = 'idle'; clearCoach();
    $('vsView').hidden = true; ui.result.hidden = true;
    ui.title.textContent = '선 긋기 축구'; ui.goal.textContent = '퍼즐을 골라 주세요';
    renderList(); ui.list.hidden = false; refreshUI();
  }

  renderList(); refreshUI(); resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  requestAnimationFrame(loop);
})();
</script>
